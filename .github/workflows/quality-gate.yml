name: CASPER BOH Quality Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
