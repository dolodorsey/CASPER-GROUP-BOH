name: Refresh Casper Lockfile

permissions:
  contents: write

on:
  push:
    branches:
      - automation/revoke-client-ddl-privileges-20260915

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/revoke-client-ddl-privileges-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(casper-boh): refresh dependency lock"
          git push origin HEAD:automation/revoke-client-ddl-privileges-20260915
